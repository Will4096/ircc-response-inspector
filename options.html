<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="IRCC 管理申请">IRCC 管理申请</title><link rel="stylesheet" href="app.css"></head><body><main class="app-shell"><header class="app-header"><div class="brand">IRCC Tracker <small data-i18n="开发预览">开发预览</small></div><nav class="app-nav" aria-label="Navigation"><a href="popup.html" data-i18n="查询进度">查询进度</a><a href="options.html" aria-current="page" data-i18n="管理申请">管理申请</a><a href="settings.html" data-i18n="设置">设置</a></nav><select id="languageHeader" data-language aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select></header><div class="page-heading"><h1 data-i18n="管理申请">管理申请</h1><p class="muted" data-i18n="保存查询所需资料，之后可在查询页切换使用。">保存查询所需资料，之后可在查询页切换使用。</p></div><div class="profile-layout"><aside class="panel profile-sidebar"><h2 data-i18n="我的申请">我的申请</h2><ul id="list" class="profile-list"></ul><button id="new" type="button" data-i18n="新增申请">新增申请</button></aside><section class="panel"><div class="panel-header"><div><h2 id="editHeading" data-i18n="新增申请">新增申请</h2><p id="editorHelp" class="help" data-i18n="按 Tracker 中的资料填写，带 * 的为必填项。">按 Tracker 中的资料填写，带 * 的为必填项。</p></div><span id="editStatus" class="badge" role="status"></span></div><form id="form"><fieldset class="editor-section"><legend data-i18n="申请标识">申请标识</legend><div class="field-grid"><div><label><span data-i18n="申请名称">申请名称</span><input name="label" required maxlength="100" placeholder="例如：本人省提名申请" data-i18n-placeholder="例如：本人省提名申请"></label></div><div><label><span data-i18n="申请编号（Application number）">申请编号（Application number）</span><input name="applicationNumber" required pattern="[A-Za-z0-9]+" maxlength="30"></label></div></div></fieldset><fieldset class="editor-section"><legend data-i18n="个人信息">个人信息</legend><div class="field-grid"><div><label><span data-i18n="姓氏（Surname / Last name）">姓氏（Surname / Last name）</span><input name="surname" required maxlength="150"></label></div><div><label><span data-i18n="名字（Given name / First name）">名字（Given name / First name）</span><input name="givenName" maxlength="150"></label></div><div class="full-width"><label class="check-field"><input name="noGivenName" type="checkbox"> <span data-i18n="无 Given name（完整姓名已填入姓氏栏）">无 Given name（完整姓名已填入姓氏栏）</span></label></div><div><label><span>UCI</span><input name="uci" required inputmode="numeric" pattern="[0-9]{8}|[0-9]{10}" placeholder="8 或 10 位数字，不含横线" data-i18n-placeholder="8 或 10 位数字，不含横线"></label></div><div><label><span data-i18n="出生日期（Date of birth）">出生日期（Date of birth）</span><input name="birthDate" type="date" required min="1900-01-01" max="9999-12-31"></label></div><div><label><span data-i18n="出生国家（Country of birth，Tracker 英文名称）">出生国家（Country of birth，Tracker 英文名称）</span><input name="country" required placeholder="例如 China 或 China (Hong Kong SAR)" data-i18n-placeholder="例如 China 或 China (Hong Kong SAR)"></label></div></div></fieldset><fieldset class="editor-section"><legend data-i18n="查询身份">查询身份</legend><div class="field-grid"><div class="full-width"><label><span data-i18n="查询身份">查询身份</span><select name="role"><option value="principalApplicantId" data-i18n="Principal applicant（主申请人）">Principal applicant（主申请人）</option><option value="sponsorId" data-i18n="Sponsor（担保人）">Sponsor（担保人）</option><option value="representativeId" data-i18n="Representative（代表）">Representative（代表）</option><option value="designatedIndividualId" data-i18n="Designated Individual（指定人士）">Designated Individual（指定人士）</option></select></label></div></div></fieldset><div class="editor-actions"><button id="saveProfile" type="submit" class="primary" data-i18n="保存申请">保存申请</button><button id="cancelEdit" type="button" data-i18n="取消修改">取消修改</button><span id="saveHint" class="muted"></span></div></form><p id="message" class="notice page-status" role="status"></p><div id="deleteArea" class="profile-delete" hidden><div><h3 data-i18n="删除此申请">删除此申请</h3><p class="help" data-i18n="同时清理该申请的本地查询缓存和对比记录。">同时清理该申请的本地查询缓存和对比记录。</p></div><button id="delete" type="button" class="danger-button" disabled data-i18n="删除申请">删除申请</button></div></section></div><footer class="app-footer" data-i18n="非 IRCC 官方扩展，与加拿大政府无隶属关系。">非 IRCC 官方扩展，与加拿大政府无隶属关系。</footer></main><script src="i18n.js"></script><script src="options.js"></script></body></html>
