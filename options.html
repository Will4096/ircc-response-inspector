<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title data-i18n="IRCC 管理申请">IRCC 管理申请</title>
<style>body{font:16px system-ui;max-width:800px;margin:40px auto;padding:20px;color:#163047}header{display:flex;align-items:center;justify-content:space-between;gap:20px}header select{width:auto;margin:0}label{display:block;margin:16px 0}input,select{display:block;width:100%;box-sizing:border-box;padding:10px;margin-top:5px}button{padding:10px;margin:8px 8px 8px 0}li{margin:10px 0}#message{white-space:pre-wrap}small{color:#52616c}.settings-panel{padding:12px 16px;background:#f5f7fa;border-radius:8px;margin:20px 0}.settings-panel select{max-width:240px}summary{cursor:pointer}input[type=checkbox]{display:inline;width:auto}</style></head>
<body><header><h1 data-i18n="管理申请">管理申请</h1><select id="languageHeader" data-language aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select></header>
<p data-i18n="添加或编辑申请信息，用于自动填写 Tracker。">添加或编辑申请信息，用于自动填写 Tracker。</p>
<p><small><strong data-i18n="隐私声明：">隐私声明：</strong><span data-i18n="申请资料、查询结果及对比记录仅保存在本机。本扩展不向开发者或第三方上传数据；查询所需信息仅提交至 IRCC 官方网站。">申请资料、查询结果及对比记录仅保存在本机。本扩展不向开发者或第三方上传数据；查询所需信息仅提交至 IRCC 官方网站。</span></small></p>
<details class="settings-panel"><summary data-i18n="设置">设置</summary><label><span data-i18n="界面语言">界面语言</span><select id="languageSettings" data-language aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select></label><label><input id="autoFill" type="checkbox"> <span data-i18n="自动填写所选申请">自动填写所选申请</span></label><p id="languageStatus" role="status"></p><p><a href="privacy.html" data-i18n="隐私政策">隐私政策</a></p><button id="clearData" type="button" data-i18n="清除本地数据">清除本地数据</button></details>
<ul id="list"></ul><button id="new" type="button" data-i18n="新增申请">新增申请</button>
<form id="form">
<label><span data-i18n="申请名称">申请名称</span><input name="label" required maxlength="100" placeholder="例如：本人省提名申请" data-i18n-placeholder="例如：本人省提名申请"></label>
<label><span data-i18n="查询身份">查询身份</span><select name="role"><option value="principalApplicantId" data-i18n="Principal applicant（主申请人）">Principal applicant（主申请人）</option><option value="sponsorId" data-i18n="Sponsor（担保人）">Sponsor（担保人）</option><option value="representativeId" data-i18n="Representative（代表）">Representative（代表）</option><option value="designatedIndividualId" data-i18n="Designated Individual（指定人士）">Designated Individual（指定人士）</option></select></label>
<label><span data-i18n="姓氏（Surname / Last name）">姓氏（Surname / Last name）</span><input name="surname" required maxlength="150"></label>
<label><span data-i18n="名字（Given name / First name）">名字（Given name / First name）</span><input name="givenName" maxlength="150"></label>
<label><input name="noGivenName" type="checkbox"> <span data-i18n="无 Given name（完整姓名已填入姓氏栏）">无 Given name（完整姓名已填入姓氏栏）</span></label>
<label>UCI<input name="uci" required inputmode="numeric" pattern="[0-9]{8}|[0-9]{10}" placeholder="8 或 10 位数字，不含横线" data-i18n-placeholder="8 或 10 位数字，不含横线"></label>
<label><span data-i18n="申请编号（Application number）">申请编号（Application number）</span><input name="applicationNumber" required pattern="[A-Za-z0-9]+" maxlength="30"></label>
<label><span data-i18n="出生日期（Date of birth）">出生日期（Date of birth）</span><input name="birthDate" type="date" required min="1900-01-01" max="9999-12-31"></label>
<label><span data-i18n="出生国家（Country of birth，Tracker 英文名称）">出生国家（Country of birth，Tracker 英文名称）</span><input name="country" required placeholder="例如 China 或 China (Hong Kong SAR)" data-i18n-placeholder="例如 China 或 China (Hong Kong SAR)"></label>
<button type="submit" data-i18n="保存申请">保存申请</button><button id="delete" type="button" disabled data-i18n="删除申请">删除申请</button>
</form><p id="message" role="status"></p><script src="i18n.js"></script><script src="options.js"></script></body></html>
