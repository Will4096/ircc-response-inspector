name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Will4096/ircc-response-inspector'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Pinned to the verified official actions/checkout v4 commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Resolve release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8")).version')"
          if [ "$REF_TYPE" = tag ]; then TAG="$REF_NAME"; else TAG="v$VERSION"; fi
          printf 'RELEASE_TAG=%s\n' "$TAG" >> "$GITHUB_ENV"

      - name: Run regression and privacy checks
        run: |
          node tests.mjs
          node comparison-tests.mjs
          node i18n-tests.mjs
          node privacy-tests.mjs
          node scripts/build-privacy.mjs --check
          node mail-tests.mjs
          node helper-health-tests.mjs
          node installer-policy-tests.mjs
          node mail-content-tests.mjs
          node ui-tests.mjs
          node backup-tests.mjs
          node submit-locator-tests.mjs
          node search-submit-tests.mjs
          node official-update-tests.mjs
          python3 windows/test_mail_host.py
          node scripts/test-build.mjs

      - name: Verify version, archive and notes
        run: |
          set -euo pipefail
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8")).version')"
          test "$RELEASE_TAG" = "v$VERSION"
          test -f "release-notes/$RELEASE_TAG.md"
          (cd downloads && sha256sum --check "ircc-response-inspector-v$VERSION.zip.sha256")

      - name: Rebuild archive from checked-out source
        run: node scripts/build-release.mjs --verify

      - name: Create release with verified assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release already exists; leaving its notes and assets unchanged.'
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "downloads/ircc-response-inspector-$RELEASE_TAG.zip" \
            "downloads/ircc-response-inspector-$RELEASE_TAG.zip.sha256" \
            --repo "$GH_REPO" --verify-tag --draft \
            --title "IRCC Response Inspector $RELEASE_TAG" \
            --notes-file "release-notes/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
