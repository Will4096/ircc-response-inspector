<!doctype html>
<html lang="zh-CN"><head><script src="layout.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRCC Tracker</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="popup.css"></head><body class="popup-page"><main class="app-shell">
<header class="app-header"><div class="brand">IRCC Tracker <small id="version"></small></div><nav class="app-nav" aria-label="Navigation"><a href="" aria-current="page" data-i18n="查询进度">查询进度</a><button id="configure" type="button" data-i18n="管理申请">管理申请</button><button id="openSettings" type="button" data-i18n="设置">设置</button></nav><select id="languageHeader" data-language aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select></header>
<section class="card query-card"><div class="query-heading"><div><div class="eyebrow" data-i18n="当前申请">当前申请</div><h1 id="applicationTitle" data-i18n="申请进度">申请进度</h1><div id="applicationNumber" class="muted"></div></div><label class="profile-picker"><span data-i18n="选择申请">选择申请</span><select id="application" aria-label="选择申请" data-i18n-label="选择申请"></select></label></div>
<div class="task-area"><div class="task-top"><h2 id="entryTitle"></h2><span id="stageLabel" class="badge"></span></div><p id="entryState" class="help"></p><ol id="querySteps" class="query-steps"><li data-step="1" data-i18n="登录 Tracker">登录 Tracker</li><li data-step="2" data-i18n="核对申请">核对申请</li><li data-step="3" data-i18n="邮箱验证">邮箱验证</li><li data-step="4" data-i18n="查看进度">查看进度</li></ol>
<div class="action-row"><a id="addFirstProfile" class="button primary" href="options.html" data-i18n="添加申请资料">添加申请资料</a><button id="openTracker" class="primary" type="button" data-i18n="打开 Tracker">打开 Tracker</button><button id="reloginTracker" type="button" hidden data-i18n="重新登录">重新登录</button><button id="fill" class="primary" type="button" data-i18n="填入 Tracker">填入 Tracker</button><div id="resultActions" hidden><button id="capture" class="primary" type="button" data-i18n="查询进度">查询进度</button></div><button id="stopCapture" type="button" hidden data-i18n="停止查询">停止查询</button></div>
<form id="verifyForm" class="verification-form" hidden><label for="code" data-i18n="邮箱验证码">邮箱验证码</label><div class="action-row"><input id="code" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" maxlength="6" required aria-describedby="manualCodeHelp"><button id="verify" class="primary" type="submit" data-i18n="验证并查询">验证并查询</button></div><p id="manualCodeHelp" class="help" data-i18n="输入本次邮件中的六位验证码。邮箱辅助不可用时，也可直接粘贴。">输入本次邮件中的六位验证码。邮箱辅助不可用时，也可直接粘贴。</p></form><p id="output" class="notice" role="status"></p></div></section>
<div id="capturePanel" data-state="idle" role="status" aria-live="polite"><span id="dot"></span><span id="captureState"></span><span id="captureReason"></span></div>
<section id="updates" class="card" hidden aria-live="polite"></section>
<section id="resultsPanel" class="card"><div class="toolbar"><div><h2 data-i18n="申请人进度">申请人进度</h2><p class="help" data-i18n="展开详情查看 History 和 Security 原始记录。">展开详情查看 History 和 Security 原始记录。</p></div><span id="progress" class="muted"></span></div><div id="results" class="table-wrap" role="region" tabindex="0" aria-label="Applicant progress"><div class="empty" data-i18n="暂无结果">暂无结果</div></div><details class="security-help"><summary data-i18n="Security 状态怎么看？">Security 状态怎么看？</summary><p class="help" data-i18n="原样显示 Tracker 返回的 Security 状态。无记录只表示本次数据中未找到相关条目，不能据此认定未进入安调。">原样显示 Tracker 返回的 Security 状态。无记录只表示本次数据中未找到相关条目，不能据此认定未进入安调。</p></details><div id="rawResults"></div></section>
<footer id="queryFooter" class="query-footer"><span id="captureTime"></span></footer>
<p class="help privacy-notice"><span data-i18n="资料和查询记录保存在本机，不上传给开发者。">资料和查询记录保存在本机，不上传给开发者。</span> <a href="privacy.html" target="_blank" rel="noopener" data-i18n="隐私政策">隐私政策</a></p><p class="app-footer" data-i18n="非 IRCC 官方扩展，与加拿大政府无隶属关系。">非 IRCC 官方扩展，与加拿大政府无隶属关系。</p></main><script src="i18n.js"></script><script src="domain.js"></script><script src="ui-model.js"></script><script src="popup.js"></script><script src="mail-popup.js"></script><script src="navigation.js"></script></body></html>
