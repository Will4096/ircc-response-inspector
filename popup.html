<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>IRCC Tracker</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><h1>IRCC Tracker <small id="version"></small></h1><div class="bar"><select id="languageHeader" data-language aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select><button id="openTracker" type="button" data-i18n="打开 Tracker">打开 Tracker</button><button id="configure" type="button" title="添加或编辑申请信息，用于自动填写 Tracker" data-i18n-title="添加或编辑申请信息，用于自动填写 Tracker" data-i18n="管理申请">管理申请</button><button id="openSettings" type="button" data-i18n="设置">设置</button></div></header>
<section class="card"><div class="toolbar"><div><div id="applicationTitle">申请进度</div><div id="applicationNumber"></div></div><div class="bar"><select id="application" aria-label="选择申请" data-i18n-label="选择申请"></select><button id="fill" type="button" data-i18n="填入 Tracker">填入 Tracker</button></div></div>
<div id="entryState" class="muted"></div><form id="verifyForm" class="bar" hidden><label for="code" data-i18n="邮箱验证码">邮箱验证码</label><input id="code" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" maxlength="6" required><button id="verify" class="primary" type="submit" data-i18n="验证并查询">验证并查询</button></form><div id="resultActions" class="bar" hidden><button id="capture" class="primary" type="button" data-i18n="查询进度">查询进度</button></div><p id="output" role="status"></p></section>
<div id="capturePanel" data-state="idle" role="status" aria-live="polite"><span id="dot"></span><span id="captureState" data-i18n="未开始">未开始</span><span id="captureReason"></span></div>
<section id="updates" class="card" hidden aria-live="polite"></section>
<section class="card"><div class="toolbar"><h2 data-i18n="申请人">申请人</h2><span id="progress" class="muted"></span></div><div id="results" class="table-wrap"><div class="empty" data-i18n="暂无结果">暂无结果</div></div><div id="rawResults"></div></section>
<footer><span id="captureTime"></span><button id="export" type="button" disabled data-i18n="导出结果">导出结果</button></footer>
<p class="privacy-notice"><strong data-i18n="隐私声明：">隐私声明：</strong><span data-i18n="申请资料和查询记录保存在本机，不上传给开发者。通过 IRCC 官网查询；可选邮箱辅助仅在开启后访问所选邮箱服务。">申请资料和查询记录保存在本机，不上传给开发者。通过 IRCC 官网查询；可选邮箱辅助仅在开启后访问所选邮箱服务。</span></p>
<p class="muted"><span data-i18n="非 IRCC 官方扩展，与加拿大政府无隶属关系。">非 IRCC 官方扩展，与加拿大政府无隶属关系。</span> · <a href="privacy.html" target="_blank" rel="noopener" data-i18n="隐私政策">隐私政策</a></p>
<script src="i18n.js"></script><script src="domain.js"></script><script src="popup.js"></script><script src="mail-popup.js"></script></body></html>
