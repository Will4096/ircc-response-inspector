<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title data-i18n="IRCC 扩展设置">IRCC 扩展设置</title><link rel="stylesheet" href="options.css"></head>
<body><header><h1 data-i18n="设置">设置</h1><div class="header-actions"><a class="nav-button" href="options.html" data-i18n="管理申请">管理申请</a><select id="languageHeader" data-language aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select></div></header>
<section class="settings-panel" aria-label="Settings"><label><span data-i18n="界面语言">界面语言</span><select id="languageSettings" data-language aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select></label><label><input id="autoFill" type="checkbox"> <span data-i18n="自动填写所选申请">自动填写所选申请</span></label><fieldset class="settings-panel"><legend data-i18n="邮箱验证码辅助（预览）">邮箱验证码辅助（预览）</legend>
<p data-i18n="默认关闭。开启后按需读取匹配的验证邮件，确认后才提交；手动输入始终可用。">默认关闭。开启后按需读取匹配的验证邮件，确认后才提交；手动输入始终可用。</p>
<label><input id="mailEnabled" type="checkbox"> <span data-i18n="启用邮箱辅助">启用邮箱辅助</span></label>
<label><span data-i18n="邮箱类型">邮箱类型</span><select id="mailProvider"><option value="gmail">Gmail · OAuth</option><option value="163">163 · Windows IMAP</option></select></label>
<label id="mailEmailRow"><span data-i18n="接收验证码的邮箱">接收验证码的邮箱</span><input id="mailEmail" type="email" autocomplete="off"></label>
<div id="gmailSettings" hidden><label>Google OAuth Client ID<input id="mailClientId" autocomplete="off"></label><p data-i18n="Gmail 需要配置 Google OAuth 客户端；只读授权可访问邮箱，不限于 IRCC 邮件。">Gmail 需要配置 Google OAuth 客户端；只读授权可访问邮箱，不限于 IRCC 邮件。</p><p>OAuth redirect URI: <code id="mailRedirect"></code></p><button id="mailAuthorize" type="button" data-mail-button data-i18n="授权 Gmail">授权 Gmail</button></div>
<div id="neteaseSettings" hidden><p data-i18n="首次使用请运行 Windows 本机安装脚本，再填写 163 客户端授权码（不是登录密码）。">首次使用请运行 Windows 本机安装脚本，再填写 163 客户端授权码（不是登录密码）。</p><p>Extension ID: <code id="mailExtensionId"></code></p><p><a href="MAIL-SETUP.md" target="_blank" data-i18n="安装与授权说明">安装与授权说明</a></p><label><span data-i18n="163 客户端授权码">163 客户端授权码</span><input id="mailPassword" type="password" autocomplete="new-password"></label><button id="mailSetup163" type="button" data-mail-button data-i18n="连接 163 并开启">连接 163 并开启</button><button id="mailHelperStatus" type="button" data-mail-button data-i18n="检查本机程序">检查本机程序</button></div>
<p data-i18n="邮箱辅助不保存邮件正文或验证码，也不上传给开发者。163 授权码由 Windows 本机程序加密保存。">邮箱辅助不保存邮件正文或验证码，也不上传给开发者。163 授权码由 Windows 本机程序加密保存。</p>
<button id="mailSave" type="button" data-mail-button data-i18n="保存邮箱设置">保存邮箱设置</button><button id="mailDisconnect" type="button" data-mail-button data-i18n="断开并清除邮箱授权">断开并清除邮箱授权</button><p id="mailStatus" role="status"></p></fieldset>
<p id="languageStatus" role="status"></p><p><a href="privacy.html" data-i18n="隐私政策">隐私政策</a></p><button id="clearData" type="button" data-i18n="清除本地数据">清除本地数据</button></section><p id="message" role="status"></p><script src="i18n.js"></script><script src="settings.js"></script><script src="mail-options.js"></script></body></html>
