<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>邮箱安装帮助</title><link rel="stylesheet" href="app.css"></head><body><main class="app-shell settings-page"><header class="app-header"><div class="brand">IRCC Tracker</div><nav class="app-nav"><a href="settings.html#mailHeading">返回邮箱设置</a><a href="mail-help.en.html">English</a></nav></header><section class="panel"><h1>先安装，再连接</h1><p class="help">通常直接在设置的“检查本机程序”旁展开安装帮助即可，无需离开设置。</p><ol><li>点击“下载安装脚本”保存本版本安装包。</li><li>复制命令并在 Windows PowerShell 运行，选择刚下载的脚本。</li><li>出现 Installation complete 后回设置检查本机程序。</li></ol><pre id="installerCommand" class="install-command"></pre><button id="installerCopy" type="button">复制安装命令</button><p id="installerFeedback" class="help" role="status"></p><p class="help">命令校验所选脚本后安装。首次可能通过 winget 下载 Python 并接受其安装协议；无需管理员权限。随后在 163 开启 IMAP 并生成客户端授权码，安装程序不索取邮箱密码。</p></section></main><script src="installer-command.js"></script><script src="installer-ui.js"></script></body></html>
