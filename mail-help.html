<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>邮箱安装帮助</title><link rel="stylesheet" href="app.css"></head><body><main class="app-shell settings-page"><header class="app-header"><div class="brand">IRCC Tracker</div><nav class="app-nav"><a href="settings.html#mailHeading">返回邮箱设置</a><a href="mail-help.en.html">English</a></nav></header><section class="panel"><h1>先安装，再连接</h1><p class="help">通常直接在设置的“检查本机程序”旁展开安装帮助即可，无需离开设置。</p><ol><li>点击下方按钮复制安装命令，扩展 ID 已自动填好。</li><li>在 Windows 开始菜单打开 PowerShell，粘贴命令并按回车。</li><li>出现 Installation complete 后，返回设置检查本机程序。</li></ol><pre id="installerCommand" class="install-command"></pre><button id="installerCopy" type="button">复制安装命令</button><p id="installerFeedback" class="help" role="status"></p><p class="help">命令负责下载、校验、安装依赖及程序并绑定当前扩展，无需源码或管理员权限。随后在 163 开启 IMAP、生成客户端授权码，再回设置连接邮箱。安装程序不会要求你输入邮箱密码。</p></section></main><script src="installer-ui.js"></script></body></html>
